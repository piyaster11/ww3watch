name: daily-refresh
on:
  schedule: [{cron: '0 0 * * *'}]   # 07:00 Bangkok
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/brink.py || echo "refresh failed; keeping previous data"
      - run: |
          git config user.name "brink-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/brink.json data/brink_history.json data/hotspots.json && git commit -m "daily refresh $(date -u +%F)" && git push || echo "no changes"
